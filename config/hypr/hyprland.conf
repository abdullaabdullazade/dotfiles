# This file sources other files in `hyprland` and `custom` folders
# You wanna add your stuff in files in `custom`

$qsConfig = ii
exec = hyprctl dispatch submap global # DO NOT REMOVE THIS OR YOU WON'T BE ABLE TO USE ANY KEYBIND
# exec-once = pkill swww-daemon
# exec-once = mpvpaper -l bottom -o "loop no-audio panscan=1.0" eDP-1 "/home/abdullaxows/Videos/sabrina-wallpaper-1080p.mp4"

submap = global # This is required for catchall to work
#exec-once = blueman-applet
# Defaults
source=hyprland/env.conf
source=hyprland/execs.conf
source=hyprland/general.conf
source=hyprland/rules.conf
source=hyprland/colors.conf
source=hyprland/keybinds.conf

# Custom 
source=custom/env.conf
source=custom/execs.conf
source=custom/general.conf
source=custom/rules.conf
source=custom/keybinds.conf

# nwg-displays support
source=workspaces.conf
source=monitors.conf

input {
    kb_layout = us, az
    kb_variant =
    kb_model =
    kb_options = grp:win_space_toggle
     
}
binde = SUPER, F2, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde = SUPER, F3, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = SUPER, F1, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Kursor temasının adını öz temanın adına uyğun dəyiş
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24

exec-once = hyprctl setcursor Bibata-Modern-Classic 24

env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
exec-once = hyprctl setcursor Bibata-Modern-Classic 24

# Move window to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10







# Switch workspace
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10








bind = ALT, SPACE, exec, rofi -show drun
bind = ALT, SPACE, exec, wofi --show drun
